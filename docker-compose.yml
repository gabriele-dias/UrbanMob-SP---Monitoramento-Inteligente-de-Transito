services:
  api:
    build:
      context: ./back-end/servicos
    environment:
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-UrbanMobSP/1.0 (mobile urban mobility project)}
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/status', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
